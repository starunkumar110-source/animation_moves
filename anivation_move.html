<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Animations</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    background:#f5f5f5;
}

.box{
    width:200px;
    height:120px;
    color:white;
    font-size:20px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:10px;
}

/* Left To Right */
.box1{
    background:red;
    animation:leftRight 3s infinite;
}

@keyframes leftRight{
    0%{transform:translateX(-200px);}
    25%{transform:translateX(-100px);}
    50%{transform:translateX(0);}
    75%{transform:translateX(100px);}
    100%{transform:translateX(200px);}
}

/* Right To Left */
.box2{
    background:green;
    animation:rightLeft 3s infinite;
}

@keyframes rightLeft{
    0%{transform:translateX(200px);}
    25%{transform:translateX(100px);}
    50%{transform:translateX(0);}
    75%{transform:translateX(-100px);}
    100%{transform:translateX(-200px);}
}

/* Top To Bottom */
.box3{
    background:blue;
    animation:topBottom 3s infinite;
}

@keyframes topBottom{
    0%{transform:translateY(-200px);}
    25%{transform:translateY(-100px);}
    50%{transform:translateY(0);}
    75%{transform:translateY(100px);}
    100%{transform:translateY(200px);}
}

/* Bottom To Top */
.box4{
    background:orange;
    animation:bottomTop 3s infinite;
}

@keyframes bottomTop{
    0%{transform:translateY(200px);}
    25%{transform:translateY(100px);}
    50%{transform:translateY(0);}
    75%{transform:translateY(-100px);}
    100%{transform:translateY(-200px);}
}

/* Rotate + Scale */
.box5{
    background:purple;
    animation:rotateScale 3s infinite;
}

@keyframes rotateScale{
    0%{
        transform:rotate(0deg) scale(0.5);
    }
    25%{
        transform:rotate(90deg) scale(0.7);
    }
    50%{
        transform:rotate(180deg) scale(1);
    }
    75%{
        transform:rotate(270deg) scale(1.2);
    }
    100%{
        transform:rotate(360deg) scale(1);
    }
}

</style>
</head>
<body>

<div class="box box1">L → R</div>
<div class="box box2">R → L</div>
<div class="box box3">T → B</div>
<div class="box box4">B → T</div>
<div class="box box5">Rotate</div>

</body>
</html>
